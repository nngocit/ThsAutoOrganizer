name = "ths-organizer-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[triggers]
crons = ["0 2 * * *"]

# Secrets — set via: wrangler secret put <SECRET_NAME>
# FIREBASE_SERVICE_ACCOUNT  — JSON string của Firebase service account key
# GOOGLE_CLIENT_ID          — OAuth 2.0 Web Client ID
# GOOGLE_CLIENT_SECRET      — OAuth 2.0 Web Client Secret
# AGENT_SECRET              — Shared secret cho Python local agent (X-Agent-Secret header)
