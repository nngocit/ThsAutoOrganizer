name = "ths-organizer-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
DEFAULT_DRIVE_ROOT = "1xAZK2zEeqgm2zN5_37ZafJPqYFhtuXtg"
DEFAULT_LOCAL_PATH = "D:\\ThacSi_HTTT\\Mon_Hoc"

# ── Công tắc hàng đợi task (G1 + G2) ──
# Có thể chỉnh NGAY trên Web UI (Cài đặt → Bảo trì hàng đợi) vì giá trị trong Firestore
# (system_config/default) được ưu tiên hơn các biến dưới đây. Đặt ở đây khi muốn ép cứng.
# TASKS_QUERY_MODE = "query"        # "query" = lọc pending phía server (chống bỏ sót) | "legacy" = cách cũ
# TASKS_RECOVERY_ENABLED = "true"   # tự trả task kẹt 'processing' về 'pending'
# TASKS_STALE_MINUTES = "15"        # ngưỡng coi là kẹt (phút)


[triggers]
crons = ["0 2 * * *", "*/15 * * * *"]

# Secrets — set via: wrangler secret put <SECRET_NAME>
# FIREBASE_SERVICE_ACCOUNT  — JSON string của Firebase Service Account key (dùng cho Firestore & Google Drive JWT 24/7)
# GOOGLE_CLIENT_ID          — OAuth 2.0 Web Client ID (dùng verify Google ID Token trên Web UI)
# AGENT_SECRET              — Shared secret xác thực Local Agent Python (header: X-Agent-Secret)
